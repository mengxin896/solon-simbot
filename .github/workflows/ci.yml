name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Install starter locally
        run: mvn -B -DskipTests install

      - name: Run demo app
        run: mvn -B -f examples/demo-app/pom.xml -DskipTests compile exec:java

      - name: Run Java demo app
        run: mvn -B -f examples/demo-app-java/pom.xml -DskipTests compile exec:java

      - name: Compile OneBot11 NapCat demo
        run: mvn -B -f examples/onebot11-napcat-demo/pom.xml -DskipTests compile
