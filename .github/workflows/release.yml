name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Resolve pom version
        id: pom-version
        shell: bash
        run: |
          echo "version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Validate tag and version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${{ steps.pom-version.outputs.version }}"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "pom version $VERSION does not match tag $TAG" >&2
            exit 1
          fi

      - name: Run tests
        run: mvn -B test

      - name: Verify example app
        run: |
          mvn -B -DskipTests install
          mvn -B -f examples/demo-app/pom.xml -DskipTests compile exec:java
          mvn -B -f examples/demo-app-java/pom.xml -DskipTests compile exec:java
          mvn -B -f examples/onebot11-napcat-demo/pom.xml -DskipTests compile
          mvn -B -f examples/onebot11-napcat-demo-java/pom.xml -DskipTests compile

      - name: Publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Pcentral-release -DskipTests deploy
